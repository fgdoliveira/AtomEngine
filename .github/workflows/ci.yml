# Continuous integration (M55, audit TEST-001): on every pull request and
# every push to master (and by hand), a fresh Windows machine clones the
# repository with its pinned submodules, configures without the game
# (ATOM_BUILD_GAME=OFF: no shader compiler needed), builds the unit tests
# in Release and runs them.
#
# A second job (M69) builds and verifies the distribution: the proof that
# the package can be made from a clean clone. It's a check, not a release
# channel - the ZIP isn't kept; packages for players are made and
# published by hand (Tools/Dist/package.ps1).
#
# What stays local, on a machine with a GPU: the in-game scenarios
# (Tests/Scenarios) and every performance measurement - hosted runners
# have no real GPU, and their timings are too noisy to judge by.
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Windows, Release)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (libraries and tests, no game)
        run: cmake -B build -S . -DATOM_BUILD_GAME=OFF -DATOM_BUILD_TESTS=ON

      - name: Build AtomTests
        run: cmake --build build --config Release --target AtomTests --parallel

      - name: Run the unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Keep the test log if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # M69: can a clean machine assemble the distribution? The game and its
  # shaders build here (dxc from the runner's Windows SDK), the package
  # command stages and verifies it - files present and absent, DLL
  # dependencies, signed shaders - and zips it; a failure turns the job
  # red. The ZIP isn't uploaded. No smoke run (-NoSmoke): hosted runners
  # have no GPU to start the game on.
  package:
    name: Package (Windows, distribution)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, stage, verify and zip
        shell: pwsh
        run: pwsh Tools/Dist/package.ps1 -NoSmoke
